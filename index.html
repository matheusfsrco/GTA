<!DOCTYPE html> 

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA VI</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <script src="js/scripts.js" defer></script>
    <script src="https://js.puter.com/v2/" defer></script>
    
</head>
<body>
    <p class="character-name"> Lucia </p>
    
    <img class="character-photo" src="img/lucia.png" alt="">

    <div class="text">
        <p class="t1"> Selecione o seu Personagem</p>
        <h1 class="t2">Não é só <br>um jogo!</h1>
        <p class="t3"> Escolha uma lenda de Dev City</p>
    </div>
    
    <div class="icons">
        
            <img onClick="choseCharacter('Lucia', 'img/lucia.png', '#ff3cac')" class="avatar" src="img/lucia.png" alt="">
        

        
            <img onClick="choseCharacter('Jason', 'img/jason.png', '#00b2c9')" class="avatar" src="img/jason.png" alt="">
        
        
        
            <img onClick="choseCharacter('CJ', 'img/cj.png', '#7ed37c')" class="avatar" src="img/cj.png" alt="">
            
        
         <label class="you">📷

            <input type="file" accept="image/*" hidden onchange="selectImage(this)">
         </label>
        
    </div>
    
</body>

</html></html>
